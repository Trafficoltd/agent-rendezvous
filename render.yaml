services:
  - type: web
    name: agent-rendezvous-board
    runtime: docker
    # A persistent disk is not available on the free plan; SQLite data would be
    # lost on every redeploy. "starter" (or higher) is required for the disk below.
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PUBLIC_BASE_URL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: PORT
        value: 8000
    disk:
      name: board-data
      mountPath: /srv/mvp/data
      sizeGB: 1
    healthCheckPath: /health
