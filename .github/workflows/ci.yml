name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r mvp/requirements-dev.txt
          pip install ruff
      - name: Lint
        run: ruff check mvp
      - name: Tests
        run: python -m pytest
