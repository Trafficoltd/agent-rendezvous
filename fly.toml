app = "agent-rendezvous-board"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  # Set PUBLIC_BASE_URL and ADMIN_SECRET as secrets, not here:
  #   fly secrets set PUBLIC_BASE_URL=https://rendezboard.com ADMIN_SECRET=...

# Persistent SQLite storage. Create it once before deploying:
#   fly volumes create board_data --size 1
[[mounts]]
  source = "board_data"
  destination = "/srv/mvp/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
